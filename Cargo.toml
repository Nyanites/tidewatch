[package]
name = "tidewatch"
version = "0.1.2"
edition = "2021"
rust-version = "1.87"
description = "Fast Windows event log (EVTX) viewer and threat-hunting tool for macOS"
license = "PolyForm-Small-Business-1.0.0"
repository = "https://github.com/Nyanites/tidewatch"
keywords = ["evtx", "dfir", "forensics", "windows-event-log", "threat-hunting"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = "0.29"
evtx = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
rfd = "0.15"
rayon = "1"
csv = "1"
regex = "1"
memchr = "2"
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"

# Finder "open file" support. Versions match what winit uses, so nothing is built twice.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
block2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSNotification", "NSOperation", "NSString", "NSURL", "NSThread", "block2"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
