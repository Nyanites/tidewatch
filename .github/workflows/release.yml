# Builds the universal macOS app and attaches Tidewatch-<version>.zip, a stable-named
# Tidewatch.zip (what docs/install.sh downloads) and SHA256SUMS.txt to a GitHub Release.
#
# To publish a release:   bump `version` in Cargo.toml, then
#                         git tag v0.1.1 && git push origin v0.1.1
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    # Only release tags (v*) may run in this environment.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build app and archive
        run: |
          ./bundle-macos.sh --universal --zip
          # A stable file name so the installer always gets the latest release.
          cp target/Tidewatch-*.zip target/Tidewatch.zip
          (cd target && shasum -a 256 Tidewatch-*.zip Tidewatch.zip > SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tidewatch
          path: |
            target/*.zip
            target/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/*.zip target/SHA256SUMS.txt \
            --title "Tidewatch ${GITHUB_REF_NAME#v}" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" target/*.zip target/SHA256SUMS.txt --clobber
